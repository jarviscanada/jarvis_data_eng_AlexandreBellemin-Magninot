# Introduce yourself, your academic and professional background.
# What excites you about the software industry and your passion. At least 80 words
summary: Double diplômé d'une Maitrise en Technologie de l'Information à l'ÉTS Montréal, et d'un diplôme d'ingénieur spécialité informatique avec l'Institut National des Sciences Appliquées de Lyon (INSA Lyon, France), je possède un profil hybride combinant ingénierie de données, analytique décisionnelle et coordination de projet. Au cours de mon parcours, j'ai pu implémenté des pipelines ETL en architecture médaillon avec Azure Data Factory et des procédures SQL, extrait des données via API d'ERP, traité des données avec Databricks et livré des tableaux de bord Power BI pour l'analyse. J'ai renforcé mes compétences de communication, d'optimisation des processus et de collaboration interfonctionnelle, en livrant des outils d'automatisation qui ont amélioré la fiabilité des données et réduit le temps d'exécution de certains processus d'une semaine à quelques minutes.
  Mon objectif est de résoudre des problèmes liés aux données, améliorer des processus et créer des solutions data impactantes pour monter en compétence.

